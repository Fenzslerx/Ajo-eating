  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#fed7aa" stroke-width="6" stroke-opacity="0.5" />
  
  <!-- Dog Paw Silhouette -->
  <g fill="#ffffff" filter="url(#shadow512)" transform="translate(256, 272) scale(2.65)">
