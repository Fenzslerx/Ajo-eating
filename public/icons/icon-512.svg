    <path d="M -32, -4 C -42, -4 -48, 16 -40, 30 C -34, 40 -16, 44 0, 44 C 16, 44 34, 40 40, 30 C 48, 16 42, -4 32, -4 C 18, -4 10, 8 0, 8 C -10, 8 -18, -4 -32, -4 Z" />
    <!-- Toe 1 (Leftmost) -->
    <ellipse cx="-34" cy="-22" rx="10" ry="14" transform="rotate(-26, -34, -22)" />
    <!-- Toe 2 (Center Left) -->
    <ellipse cx="-13" cy="-35" rx="11" ry="16" transform="rotate(-8, -13, -35)" />
    <!-- Toe 3 (Center Right) -->
    <ellipse cx="13" cy="-35" rx="11" ry="16" transform="rotate(8, 13, -35)" />
    <!-- Toe 4 (Rightmost) -->
