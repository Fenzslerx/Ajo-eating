<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="188" height="188" rx="42" fill="none" stroke="#fed7aa" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Dog Paw Silhouette -->
  <g fill="#ffffff" filter="url(#shadow)" transform="translate(96, 102)">
    <!-- Main Pad -->
    <path d="M -32, -4 C -42, -4 -48, 16 -40, 30 C -34, 40 -16, 44 0, 44 C 16, 44 34, 40 40, 30 C 48, 16 42, -4 32, -4 C 18, -4 10, 8 0, 8 C -10, 8 -18, -4 -32, -4 Z" />
    <!-- Toe 1 (Leftmost) -->
    <ellipse cx="-34" cy="-22" rx="10" ry="14" transform="rotate(-26, -34, -22)" />
    <!-- Toe 2 (Center Left) -->
    <ellipse cx="-13" cy="-35" rx="11" ry="16" transform="rotate(-8, -13, -35)" />
    <!-- Toe 3 (Center Right) -->
    <ellipse cx="13" cy="-35" rx="11" ry="16" transform="rotate(8, 13, -35)" />
    <!-- Toe 4 (Rightmost) -->
    <ellipse cx="34" cy="-22" rx="10" ry="14" transform="rotate(26, 34, -22)" />
  </g>
</svg>
